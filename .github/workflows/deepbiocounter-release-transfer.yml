name: Transfer verified DeepBioCounter 0.2.7 packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARM64_URL: ${{ secrets.DBC_TRANSFER_ARM64 }}
      INTEL_URL: ${{ secrets.DBC_TRANSFER_INTEL }}
      WINDOWS_URL: ${{ secrets.DBC_TRANSFER_WINDOWS }}
    steps:
      - name: Copy verified artifacts to the draft release
        shell: bash
        run: |
          set -euo pipefail
          version=v0.2.7
          test "$(gh release view "$version" --json isDraft --jq '.isDraft')" = true
          cd "$(mktemp -d)"
          gh release download "$version" --pattern SHA256SUMS.txt

          transfer() {
            local url="$1" digest="$2" asset="$3"
            local wrapper="artifact-$asset"
            curl --fail --silent --show-error --retry 2 --max-time 240 --output "$wrapper" "$url"
            printf '%s  %s\n' "$digest" "$wrapper" | sha256sum --check --strict
            [[ $(unzip -Z -1 "$wrapper") = "$asset" ]]
            unzip -p "$wrapper" "$asset" > "$asset"
          }

          transfer "$ARM64_URL" 61fe735b1c55be8ae601e39bdac20b1588dbde6268bc401bbab032d2a7ef648f DeepBioCounter-macOS-Apple-Silicon.zip &
          arm_pid=$!
          transfer "$INTEL_URL" ea8abab76610d60257e1a322a575d91492d45ecedece38927a62e5f889010722 DeepBioCounter-macOS-Intel.zip &
          intel_pid=$!
          transfer "$WINDOWS_URL" 229d2c1d5192c231f5314c6b4f330dbe7f8ddff1891138e36e4d7a2148b04b41 DeepBioCounter-Windows-x64.zip &
          windows_pid=$!
          wait "$arm_pid" "$intel_pid" "$windows_pid"
          sha256sum --check --strict SHA256SUMS.txt
          for asset in DeepBioCounter-*.zip; do
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            existing=$(gh release view "$version" --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")
            if [[ "$existing" != "sha256:$digest" ]]; then
              [[ -z "$existing" ]]
              gh release upload "$version" "$asset"
            fi
          done
