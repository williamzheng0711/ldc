<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light">
<title>骨髓脂滴複核</title>
<style>
  :root {
    font-family: "Geist", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: #202a35;
    background: #f1f5f6;
    --ink: #202a35;
    --muted: #536371;
    --line: #cbd6d9;
    --accent: #0a695e;
    --accent-light: #e9f7f2;
    --surface: #fff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  button, select, textarea, input { font: inherit; }
  button, select {
    min-height: 42px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  button:enabled, select:enabled { cursor: pointer; }
  button:enabled:hover { border-color: var(--accent); }
  button:disabled, select:disabled { color: #74838c; background: #eef2f3; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid #2c8b81;
    outline-offset: 3px;
  }
  a { color: var(--accent); }
  p, h1, h2 { margin: 0; }
  .shell { max-width: 1148px; margin-inline: auto; padding: 30px 26px 46px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: clamp(1.35rem, 3.4vw, 2rem); line-height: 1.25; letter-spacing: -.025em; }
  .summary { margin-top: 9px; color: var(--muted); font-size: .91rem; }
  .account { display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: .88rem; }
  .account button { white-space: nowrap; }
  .panel { margin-top: 23px; border: 1px solid var(--line); background: var(--surface); border-radius: 13px; overflow: hidden; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 14px 19px;
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; flex-wrap: wrap; gap: 7px; }
  .step { display: flex; justify-content: space-between; gap: 8px; }
  .step #next:enabled { color: #fff; background: var(--accent); border-color: var(--accent); }
  .step #next:enabled:hover { background: #095548; }
  .meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .86rem; }
  progress { inline-size: 118px; block-size: 9px; accent-color: var(--accent); }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(255px, 1fr); grid-template-rows: auto 1fr; }
  .viewer {
    grid-area: 1 / 1 / span 2;
    min-width: 0;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: #1a222c;
    color: #e7edf2;
  }
  .image-slot { width: min(100%, 590px); }
  .image-box { position: relative; width: var(--image-width, 100%); overflow: hidden; overflow: clip; margin-inline: auto; border-radius: 3px; user-select: none; }
  .image-box.is-zoomed { cursor: grab; touch-action: none; }
  .image-box.panning { cursor: grabbing; }
  .image-layer { position: absolute; inset: 0 auto auto 0; width: 100%; height: 100%; }
  .image-box img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .zoom-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; }
  .zoom-tools button { min-width: 36px; min-height: 34px; padding: 4px 8px; }
  .zoom-value { min-width: 4ch; margin-inline: 3px; text-align: center; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .target {
    position: absolute;
    top: var(--target-y, 50%);
    left: var(--target-x, 50%);
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .target i {
    position: absolute;
    display: block;
    background: #74f5ff;
    box-shadow: 0 0 0 1px #23353d;
    border-radius: 1px;
  }
  .target i:nth-child(1), .target i:nth-child(2) { top: 21px; width: 7px; height: 2px; }
  .target i:nth-child(1) { left: 0; }
  .target i:nth-child(2) { right: 0; }
  .target i:nth-child(3), .target i:nth-child(4) { left: 21px; width: 2px; height: 7px; }
  .target i:nth-child(3) { top: 0; }
  .target i:nth-child(4) { bottom: 0; }
  .outline {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    pointer-events: none;
  }
  .outline-shape {
    fill: none;
    stroke: #ffdc68;
    stroke-width: 2;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 1px #1a222c);
  }
  .outline-edge {
    fill: none;
    stroke: transparent;
    stroke-width: 20;
    pointer-events: stroke;
    cursor: crosshair;
  }
  .outline-dot {
    fill: #ffdc68;
    stroke: #1a222c;
    stroke-width: 1.4;
  }
  .outline-vertex {
    pointer-events: all;
    cursor: grab;
  }
  .outline-vertex:active { cursor: grabbing; }
  .outline-vertex:focus-visible { outline: none; }
  .outline-vertex:focus-visible .outline-dot { fill: #fff; stroke-width: 2.5; }
  .outline-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 10px;
    color: #d1dde4;
    font-size: .82rem;
  }
  .outline-tools button { min-height: 34px; padding: 5px 9px; }
  .image-status { color: #dfedf1; font-size: .88rem; text-align: center; padding: 8px 0; }
  .caption { font-size: .82rem; color: #d1dde4; }
  .locator {
    grid-area: 1 / 2;
    display: grid;
    grid-template-columns: minmax(0, min(43%, 176px)) minmax(0, 1fr);
    align-items: center;
    align-self: start;
    gap: 12px;
    margin: clamp(18px, 3.5vw, 32px) clamp(18px, 3.5vw, 32px) 0;
    padding: 8px;
    border: 1px solid #495564;
    border-radius: 8px;
    background: #222d39;
    color: #e7edf2;
  }
  .locator-open { display: block; width: 100%; min-height: 0; padding: 0; overflow: hidden; }
  .locator-open:enabled:hover { border-color: #ffdc68; }
  .locator-title { margin-bottom: 3px; font-size: .88rem; font-weight: 680; }
  .locator-copy { color: #d1dde4; font-size: .79rem; line-height: 1.45; }
  .locator-map { position: relative; display: block; width: 100%; overflow: hidden; background: #17202a; }
  .locator-map img { display: block; width: 100%; height: 100%; }
  .locator-frame {
    position: absolute;
    left: var(--crop-left);
    top: var(--crop-top);
    width: var(--crop-width);
    height: var(--crop-height);
    border: 2px solid #ffdc68;
    box-shadow: 0 0 0 1px #17202a, inset 0 0 0 1px #17202a;
    pointer-events: none;
  }
  .locator-dialog {
    width: min(calc(100% - 28px), 850px);
    max-height: calc(100% - 28px);
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    color: var(--ink);
    background: var(--surface);
  }
  .locator-dialog::backdrop { background: #15212bc2; }
  .locator-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .locator-dialog h2 { font-size: 1.13rem; }
  .locator-dialog .locator-map { max-width: min(100%, var(--locator-fit)); margin-inline: auto; border-radius: 4px; }
  .locator-dialog .locator-frame { border-width: 3px; }
  .locator-dialog p { margin-top: 8px; color: var(--muted); font-size: .85rem; }
  .form {
    grid-area: 2 / 2;
    padding: clamp(18px, 3.5vw, 32px);
    display: flex;
    flex-direction: column;
    gap: 19px;
  }
  fieldset { margin: 0; padding: 0; border: 0; min-inline-size: 0; }
  legend { padding: 0; margin-bottom: 13px; font-size: clamp(1.03rem, 2.4vw, 1.23rem); font-weight: 690; line-height: 1.45; }
  .choices { display: grid; gap: 9px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  fieldset:disabled .choice { cursor: default; color: var(--muted); background: #f3f6f6; }
  fieldset:not(:disabled) .choice:hover { border-color: var(--accent); }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-light); }
  .choice:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice input { inline-size: 17px; block-size: 17px; margin: 0; accent-color: var(--accent); }
  .note-title { display: block; margin-bottom: 7px; font-size: .91rem; font-weight: 620; }
  .note-title span { margin-left: 5px; color: var(--muted); font-weight: 400; }
  textarea {
    width: 100%;
    min-height: 69px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--ink);
    background: var(--surface);
    resize: vertical;
  }
  .footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
    padding: 12px 19px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .84rem;
  }
  .footer button { min-height: 34px; padding: 5px 9px; }
  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 12px; }
  .attention { color: #804c01; }
  .unlock {
    width: min(100%, 455px);
    margin-top: 24px;
    padding: clamp(18px, 5vw, 28px);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .unlock form { display: grid; gap: 16px; margin-top: 19px; }
  .unlock label { display: grid; gap: 6px; font-weight: 600; }
  .unlock input { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; }
  .unlock button { justify-self: start; }
  .unlock button:enabled, #export:enabled { background: var(--accent); color: #fff; }
  .unlock-status { min-height: 1.4em; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .status-note { margin-top: 5px; }
  @media (max-width: 710px) {
    .shell { padding: 19px 14px 29px; }
    .panel { margin-top: 16px; }
    .workspace { grid-template-columns: 1fr; grid-template-rows: auto; }
    .viewer { grid-area: 1 / 1; min-height: 0; padding: 10px; }
    .image-box { width: min(var(--image-width, 100%), 47svh); }
    .workspace:has(.locator:not([hidden])) .image-box { width: min(var(--image-width, 100%), 40svh); }
    .locator {
      grid-area: 2 / 1;
      grid-template-columns: minmax(0, 130px) minmax(0, 1fr);
      margin: 0;
      padding: 3px 12px 10px;
      border: 0;
      border-radius: 0;
      background: #1a222c;
    }
    .form { grid-area: 3 / 1; padding: 17px; }
  }
  @media (max-width: 460px) {
    .account { flex-direction: column; align-items: flex-end; gap: 4px; }
    .account button { min-height: 37px; }
    .summary { max-width: 240px; font-size: .83rem; }
    .toolbar { padding: 10px 12px; }
    .meter { gap: 7px; }
    progress { inline-size: 75px; }
    .footer { padding: 11px 13px; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <h1>骨髓脂滴複核</h1>
      <p class="summary">共 500 題，可分次完成。</p>
    </div>
    <div class="account" id="account" hidden>
      <span id="reviewer"></span>
      <button id="lock" type="button">鎖定</button>
    </div>
  </header>

  <section class="unlock" id="unlock" aria-labelledby="unlock-title">
    <h2 id="unlock-title">開啟標註</h2>
    <p class="summary">請輸入原本的標註名稱與收到的金鑰。</p>
    <form id="unlock-form">
      <label>標註名稱<input id="reviewer-name" type="text" autocomplete="username" required maxlength="60"></label>
      <label>標註金鑰<input id="access-key" type="password" autocomplete="off" required maxlength="64" spellcheck="false" autocapitalize="none"></label>
      <button id="unlock-button" type="submit">開啟題目</button>
    </form>
    <p class="unlock-status" id="unlock-status" role="status"></p>
  </section>
  <section id="review-panel" class="panel" aria-label="複核題目" hidden>
    <div class="toolbar">
      <nav class="nav" aria-label="題目導覽">
        <select id="tile-select" aria-label="跳到題目"></select>
      </nav>
      <div class="meter">
        <span id="progress-text" aria-live="polite"></span>
        <progress id="progress" aria-label="複核進度"></progress>
      </div>
    </div>

    <div class="workspace">
      <section class="viewer" aria-label="影像與定位">
        <div id="image-slot" class="image-slot"></div>
        <p class="image-status" id="image-status" role="status"></p>
        <button id="retry-image" type="button" hidden>重新載入影像</button>
        <p class="caption" id="caption" hidden>圖內可用滾輪或觸控板縮放。放大後拖曳影像可移動視野。</p>
        <div class="zoom-tools" id="zoom-tools" role="group" aria-label="影像縮放" hidden>
          <button id="zoom-out" type="button" aria-label="縮小影像">−</button>
          <span class="zoom-value" id="zoom-value" aria-label="縮放倍率">100%</span>
          <button id="zoom-in" type="button" aria-label="放大影像">+</button>
          <button id="zoom-reset" type="button">重設縮放</button>
        </div>
        <div class="outline-tools" id="outline-tools" hidden>
          <p id="outline-help" role="status"></p>
          <button id="outline-undo" type="button" disabled hidden>復原上一步</button>
          <button id="outline-reset" type="button" disabled hidden>還原估計輪廓</button>
          <button id="outline-retry" type="button" hidden>重新載入輪廓</button>
        </div>
      </section>
      <div class="locator" id="locator" hidden>
        <button type="button" class="locator-open" id="locator-open" aria-label="放大整圖定位" aria-haspopup="dialog" disabled>
          <span class="locator-map" id="locator-map"><span class="locator-frame" aria-hidden="true" hidden></span></span>
        </button>
        <div>
          <p class="locator-title">整圖定位</p>
          <p class="locator-copy" id="locator-copy" role="status"></p>
        </div>
      </div>
      <section class="form" aria-label="填寫判讀">
        <fieldset id="choices" disabled>
          <legend>圖中標記的位置是脂滴嗎？</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="decision" value="correct">是，脂滴</label>
            <label class="choice"><input type="radio" name="decision" value="false_positive">不是脂滴</label>
            <label class="choice"><input type="radio" name="decision" value="uncertain">無法確定</label>
          </div>
        </fieldset>
        <div>
          <label class="note-title" for="note">備註 <span>可選</span></label>
          <textarea id="note" rows="2" maxlength="1500" disabled></textarea>
        </div>
        <div class="step">
          <button id="prev" type="button" disabled>上一題</button>
          <button id="next" type="button" disabled>下一題</button>
        </div>
      </section>
    </div>

    <div class="footer">
      <div>
        <p id="save-state" role="status"></p>
        <p class="status-note">完成後下載 JSON 檔並傳回研究團隊。進度只保存在本瀏覽器。</p>
      </div>
      <div class="actions">
        <button id="export" type="button">下載標註 JSON</button>
      </div>
    </div>
  </section>
</main>
<dialog class="locator-dialog" id="locator-dialog" aria-labelledby="locator-title">
  <div class="locator-dialog-header">
    <h2 id="locator-title">整圖定位</h2>
    <form method="dialog"><button type="submit" autofocus>關閉</button></form>
  </div>
  <div class="locator-map" id="locator-large"><span class="locator-frame" aria-hidden="true" hidden></span></div>
  <p>黃框標出本題小圖的範圍。</p>
</dialog>
<script src="./outline.js?v=3" defer></script>
<script src="./viewport.js?v=1" defer></script>
<script src="./review.js?v=500" defer></script>
</body>
</html>
